<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>😻 또치의 방치 RPG 😻</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* [스타일 유지 - 기존과 동일] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: #121212; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .game-wrapper { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        .navigation-bar { display: flex; gap: 4px; position: sticky; top: 0; z-index: 1000; background: #121212; padding: 6px 0; border-bottom: 1px solid #222; }
        .tab-btn, .mode-toggle-btn { background: #2a2a2a; color: #aaa; border: 1px solid #444; border-radius: 8px; padding: 8px 0; font-size: 0.8rem; font-weight: bold; text-align: center; cursor: pointer; flex: 1; }
        .tab-btn.active { background: #e67e22; color: #fff; border-color: #e67e22; }
        .mode-toggle-btn { background: #3498db; color: #fff; border-color: #2980b9; flex: 1.2; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 14px; border: 1px solid #333; margin-bottom: 10px; }
        h2 { border-bottom: 2px solid #444; padding-bottom: 8px; margin-bottom: 12px; font-size: 1rem; color: #f1c40f; display: flex; justify-content: space-between; align-items: center; }
        button, input { background: #34495e; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; min-height: 36px; }
        #log-box { height: 260px; overflow-y: auto; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 10px; font-size: 0.8rem; }
    </style>
</head>
<body class="mobile-mode">

<div class="game-wrapper">
    <div class="navigation-bar">
        <div id="tab-btn-status" class="tab-btn active" onclick="switchTab('tab-status', this)">👤 상태</div>
        <div id="tab-btn-shop" class="tab-btn" onclick="switchTab('tab-shop', this)">🏰 상점</div>
        <div id="tab-btn-battle" class="tab-btn" onclick="switchTab('tab-battle', this)">⚔️ 전투</div>
    </div>

    <div id="tab-status" class="tab-content active">
        <div class="card">
            <h2>👤 용사 정보</h2>
            <div>💰 <strong>골드:</strong> <span id="p-gold">200</span>G | 💎 <strong>룬 파편:</strong> <span id="p-shards">0</span>개</div>
            <div>🧊 <strong>큐브:</strong> <span id="p-cubes">0</span>개 | 🔮 <strong>룬의 큐브:</strong> <span id="p-rune-cubes">0</span>개</div>
            <div>⏩ <strong>배속 코인:</strong> <span id="p-speed-coins">0</span>개</div>
        </div>
    </div>

    <div id="tab-shop" class="tab-content">
        <div class="card">
            <h2>🏰 쿠폰 입력</h2>
            <input type="text" id="coupon-input" placeholder="쿠폰 코드를 입력하세요" style="width:100%; margin-bottom:10px;">
            <button onclick="useCoupon()" style="width:100%; background:#e67e22;">쿠폰 사용</button>
        </div>
    </div>

    <div id="tab-battle" class="tab-content">
        <div class="card">
            <h2>⚔️ 전투 로그</h2>
            <div id="log-box"></div>
        </div>
    </div>
</div>

<script>
    let player = {
        name: "지존용사", gold: 200, shards: 0, cubes: 0, runeCubes: 0, speedCoins: 0, usedCoupons: []
    };

    function log(msg) {
        const logBox = document.getElementById("log-box");
        const div = document.createElement("div"); div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
        document.getElementById("p-gold").innerText = player.gold.toLocaleString();
        document.getElementById("p-shards").innerText = player.shards.toLocaleString();
        document.getElementById("p-cubes").innerText = player.cubes.toLocaleString();
        document.getElementById("p-rune-cubes").innerText = player.runeCubes.toLocaleString();
        document.getElementById("p-speed-coins").innerText = player.speedCoins.toLocaleString();
    }

    function useCoupon() {
        const inputElem = document.getElementById("coupon-input");
        const code = inputElem.value.trim();

        if (!code) return;

        // 1. 중복 확인
        if (player.usedCoupons.includes(code)) {
            alert("이미 사용한 1회성 쿠폰 코드입니다.");
            return;
        }

        // 2. 사용 확인
        if (!confirm("이 계정에 사용하시겠습니까?")) return;

        let success = false;

        // 3. 쿠폰 로직
        if (code === "운영자테스트") {
            player.shards += 500000;
            player.cubes += 500000;
            player.runeCubes += 500000;
            player.speedCoins += 1000;
            player.gold += 100000000;
            success = true;
            log(`🎁 <span style="color:#f1c40f;">운영자 테스트 쿠폰 적용 완료!</span>`);
        } else if (code === "love") {
            player.runeCubes += 10;
            success = true;
        }

        if (success) {
            player.usedCoupons.push(code);
            alert("적용되었습니다.");
            inputElem.value = "";
            updateUI();
        } else {
            alert("존재하지 않는 쿠폰 코드입니다.");
        }
    }

    window.switchTab = function(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    };

    updateUI();
</script>
</body>
</html>
